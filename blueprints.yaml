name: Personio Jobs
slug: personio-jobs
type: plugin
version: 1.0.0
description: Fetch, cache and show job offerings from Personio
icon: plug
author:
  name: Sebastian Laube
  email: sebastian.laube@mindbox.de
homepage: https://github.com/mindbox/grav-plugin-personio-jobs
keywords: grav, plugin, personio, jobs
bugs: https://github.com/mindbox/grav-plugin-personio-jobs/issues
docs: https://github.com/mindbox/grav-plugin-personio-jobs/blob/develop/README.md
license: MIT

dependencies:
  - { name: grav, version: '>=1.6.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
    source:
      type: text
      label: PLUGIN_PERSONIO_JOBS.SOURCE
      help: PLUGIN_PERSONIO_JOBS.SOURCE_HELP
